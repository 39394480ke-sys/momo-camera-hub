camera:
  backend: v4l2
  device: /dev/momo-camera
  width: 1920
  height: 1080
  fps: 30
  rotation: 0
  pixel_format: yuyv422

encoder:
  implementation: libx264
  bitrate: 6M
  keyframe_interval: 30

stream:
  path: armcam
  rtsp_port: 8554
  hls_port: 8888
  webrtc_port: 8889
  webrtc_udp_port: 8189
  api_port: 9997
  mediamtx_binary: /usr/local/bin/mediamtx

analysis_stream:
  enabled: true
  path: armcam-analysis
  width: 640
  height: 360
  fps: 30
  bitrate: 1M
  keyframe_interval: 30

vision:
  base_url: http://127.0.0.1:8000

server:
  host: 0.0.0.0
  port: 8020

storage:
  root: /var/lib/momo-camera-hub
  minimum_free_gib: 5

ffmpeg_binary: ffmpeg
ffprobe_binary: ffprobe
